[project]
name = "backend"
version = "0.1.0"
description = "Tactical IPB Chatbot Backend"
authors = [
    {name = "alexandros", email = "alex.kyr.triant@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "pdf2image>=1.17.0,<2.0.0",
    "pytesseract>=0.3.13,<0.4.0",
    "pillow>=11.3.0,<12.0.0",
    "flask>=3.1.2,<4.0.0",
    "flask-cors>=6.0.1,<7.0.0",
    "langchain-community>=0.3.31,<0.4.0",
    "langchain>=0.3.27,<0.4.0",
    "langchain-huggingface>=0.3.1,<0.4.0",
    "langchain-ollama>=0.3.10,<0.4.0",
    "langchain-experimental>=0.3.4,<0.4.0",
    "chromadb>=1.1.1,<2.0.0",
    "sentence-transformers>=5.1.1,<6.0.0",
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "numpy>=1.24.0",
    "pypdf>=3.17.0",
    # Geospatial tools
    "pyproj>=3.5.0",
    "mgrs>=1.4.0",
    "pygeohash>=1.0.0",
    "openlocationcode>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
# Anchor pytest to backend/ so it uses this venv, not a parent-dir config.
rootdir = "."
pythonpath = ["."]
testpaths = ["../tests"]
